[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-repair-agent"
version = "0.1.0"
description = "Sandbox Repository-Level Automated Code Repair Agent with AST Fault Localization and Test-Driven Self-Healing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AI Agent Portfolio (F1 SWE Code Repair)" }
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
